<!DOCTYPE html>
<html lang="en" class="dark h-full bg-[#090d16]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetPulse - Enterprise Infrastructure & Network Monitor</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              900: '#14532d',
            },
            dark: {
              900: '#070a11',
              800: '#0d1322',
              700: '#152035',
              600: '#1e2d4a',
              500: '#2d3f62',
            }
          },
          fontFamily: {
            mono: ['JetBrains Mono', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Importmap for React and Lucide Icons -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "lucide-react": "https://esm.sh/lucide-react@0.400.0?external=react,react-dom"
    }
  }
  </script>

  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Custom scrollbars and styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0d1322;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e2d4a;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #2d3f62;
    }
    
    .pulse-glow {
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.4);
    }
    .pulse-glow-critical {
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.5);
    }
    
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 0.4; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .animate-pulse-slow {
      animation: pulse-ring 3s infinite ease-in-out;
    }
  </style>
</head>
<body class="h-full text-slate-200 bg-[#070a11] font-sans antialiased selection:bg-emerald-500/30 selection:text-emerald-200">
  <div id="root" class="h-full"></div>

  <!-- React Application Source -->
  <script type="text/babel" data-type="module" data-presets="react" src="./app.jsx"></script>
</body>
</html>
